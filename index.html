<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Floot NG - Bike Delivery Only</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--purple:#7C3AED;--purple2:#A78BFA;--purple3:#EDE9FE;--dark:#1F1A2E;--muted:#8B8BA7;--green:#10B981;--white:#fff}
body{font-family:Inter,system-ui,sans-serif;background:#FBFAFF;color:var(--dark);overflow:hidden}
.app{max-width:440px;margin:0 auto;height:100vh;background:#fff;position:relative;display:flex;flex-direction:column;overflow:hidden}
.auth-bg{background:linear-gradient(180deg,#7C3AED 0%, #5B21B6 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:fixed;inset:0;z-index:100000}
.auth-card{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:28px;box-shadow:0 20px 60px rgba(92,33,182,.3)}
.input{width:100%;background:#F5F3FF;border:1px solid #EDE9FE;border-radius:14px;padding:14px 14px 14px 42px;font-size:14px;outline:none;margin-bottom:10px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--purple2)}
.btn{border:none;border-radius:14px;padding:14px;font-weight:800;font-size:14px;cursor:pointer;transition:.2s}
.btn-primary{background:linear-gradient(90deg,#7C3AED,#8B5CF6);color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.25)}
.btn-ghost{background:#F5F3FF;color:var(--purple);border:1px solid #EDE9FE}
.btn-dark{background:#1F1A2E;color:#fff}
.tabs{display:flex;background:#F5F3FF;border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:10px;border-radius:10px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.tab.active{background:#fff;color:var(--purple);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #F3F0FF;z-index:10}
.avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7C3AED,#A78BFA);display:grid;place-items:center;color:#fff;font-weight:900}
.online-pill{display:flex;align-items:center;gap:8px;background:#F5F3FF;border:1px solid #EDE9FE;border-radius:999px;padding:6px 12px;cursor:pointer}
.switch{width:40px;height:24px;background:#E5E7EB;border-radius:999px;position:relative;transition:.2s}
.switch.on{background:#10B981}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch.on::after{left:18px}
.map-container{flex:1;position:relative;background:#F5F3FF}
#driverMap{width:100%;height:100%;z-index:1}
.bottom-sheet{background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.12);padding:16px;position:relative;z-index:20;max-height:55vh;overflow:auto}
.card{background:#fff;border:1px solid #F3F0FF;border-radius:18px;padding:14px;box-shadow:0 4px 20px rgba(124,58,237,.06);margin-bottom:10px}
.incoming{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:none;align-items:end;justify-content:center;padding:12px}
.incoming.show{display:flex}
.incoming-card{width:100%;max-width:420px;background:#fff;border-radius:28px;overflow:hidden;animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,58,237,.4)}70%{box-shadow:0 0 0 16px rgba(124,58,237,0)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.trip-locked{position:fixed;inset:0;z-index:10000;background:#fff;display:none;flex-direction:column}
.trip-locked.active{display:flex}
.trip-map{height:42vh;position:relative;background:#F5F3FF}
#tripMap{width:100%;height:100%}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid #F3F0FF;display:flex;justify-content:space-around;padding:8px 0 14px;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 18px;border-radius:12px}
.nav-item.active{color:var(--purple);background:#F5F3FF}
.nav-item i{font-size:18px}
.history-item{display:flex;gap:12px;padding:12px;border:1px solid #F3F0FF;border-radius:14px;margin-bottom:8px;background:#fff}
.small{font-size:11px;color:var(--muted)}
.parcel-thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#F5F3FF;border:1px solid #EDE9FE}
</style>
